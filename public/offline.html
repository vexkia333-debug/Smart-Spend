<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SmartSpend — Mất kết nối Internet</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-main: #03150e;
      --bg-card: rgba(7, 29, 20, 0.88);
      --border: rgba(52, 211, 153, 0.25);
      --text-main: #ecfdf5;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.16);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg-main: #dfeee6;
      --bg-card: rgba(240, 248, 244, 0.92);
      --border: rgba(15, 118, 86, 0.22);
      --text-main: #0f241d;
      --text-muted: #3d584e;
      --accent: #059669;
      --accent-soft: rgba(16, 185, 129, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 18% 15%, rgba(16, 185, 129, 0.22), transparent 45%),
        radial-gradient(circle at 82% 85%, rgba(5, 150, 105, 0.18), transparent 45%),
        var(--bg-main);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 26px;
      text-align: center;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }
    .icon-ring {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: var(--accent-soft);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fb7185;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 22px;
    }
    html[data-theme="light"] .status-pill {
      color: #e11d48;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.6s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.32);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); opacity: 0.9; }
  </style>
  <script>
    try {
      var saved = localStorage.getItem('smartspend_theme');
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <div class="card">
    <div class="icon-ring" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01" />
        <path d="M8.5 16.429a5 5 0 0 1 7 0" />
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
        <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
        <path d="m2 2 20 20" />
      </svg>
    </div>
    <h1>Không có kết nối Internet</h1>
    <p>SmartSpend cần kết nối mạng để tải dữ liệu ví và đồng bộ giao dịch. Vui lòng kiểm tra Wi-Fi hoặc 4G/5G rồi thử lại.</p>
    <div class="status-pill">
      <span class="dot"></span>
      <span>Đang chờ kết nối lại…</span>
    </div>
    <button class="btn" type="button" onclick="window.location.reload()">Thử kết nối lại</button>
  </div>
  <script>
    window.addEventListener('online', function () {
      window.location.reload();
    });
  </script>
</body>
</html>
