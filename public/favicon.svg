<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="50%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Metallic S Gradient -->
    <linearGradient id="metalS" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Inner Ambient Glows -->
  <circle cx="210" cy="270" r="130" fill="#10b981" opacity="0.18" filter="blur(30px)"/>
  <circle cx="300" cy="230" r="120" fill="#06b6d4" opacity="0.22" filter="blur(30px)"/>

  <!-- Neon Glowing Credit Card Element (Behind S upper loop) -->
  <g transform="translate(230, 160) rotate(32)" filter="url(#cyanGlow)">
    <rect x="-80" y="-50" width="160" height="100" rx="16" fill="none" stroke="url(#neonCyan)" stroke-width="12" opacity="0.95"/>
    <rect x="-60" y="-30" width="36" height="26" rx="6" fill="#38bdf8" opacity="0.8"/>
    <line x1="-60" y1="20" x2="10" y2="20" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <line x1="-60" y1="32" x2="-20" y2="32" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Neon Emerald Coin Element (Behind S lower loop) -->
  <g transform="translate(205, 290) rotate(-15)" filter="url(#emeraldGlow)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#neonEmerald)" stroke-width="12" opacity="0.95"/>
    <circle cx="0" cy="0" r="54" fill="#064e3b" opacity="0.4"/>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="70" font-weight="900" fill="#34d399" text-anchor="middle" opacity="0.9">₫</text>
  </g>

  <!-- 3D Metallic Glossy Monogram 'S' -->
  <path d="
    M 335 155
    C 335 110, 295 90, 245 90
    C 175 90, 140 130, 140 180
    C 140 235, 190 255, 255 275
    C 320 295, 360 320, 360 375
    C 360 435, 305 460, 240 460
    C 170 460, 125 425, 125 375
    L 175 375
    C 175 405, 205 422, 245 422
    C 295 422, 320 398, 320 365
    C 320 325, 275 305, 210 285
    C 150 265, 100 235, 100 180
    C 100 115, 160 52, 248 52
    C 325 52, 375 95, 375 155
    Z
  " fill="url(#metalS)" stroke="#0f172a" stroke-width="3"/>

  <!-- Specular Highlight Overlay on S -->
  <path d="
    M 248 56
    C 318 56, 365 95, 368 150
    L 338 150
    C 335 112, 298 94, 248 94
    C 182 94, 144 130, 144 176
    C 144 218, 180 242, 240 262
    C 246 250, 256 242, 268 238
    C 215 220, 175 200, 175 174
    C 175 138, 204 115, 255 115
    C 285 115, 310 128, 320 145
    Z
  " fill="#ffffff" opacity="0.35"/>
</svg>