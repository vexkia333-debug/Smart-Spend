<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Ribbon Outer Flow: Cyan to Emerald -->
    <linearGradient id="ribbonOuter" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ribbon Inner Fold: Deeper Emerald/Teal for 3D depth -->
    <linearGradient id="ribbonInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Soft Ambient Backlight -->
  <circle cx="256" cy="190" r="140" fill="#06b6d4" opacity="0.16" filter="blur(40px)"/>
  <circle cx="256" cy="330" r="140" fill="#10b981" opacity="0.18" filter="blur(40px)"/>

  <!-- Continuous Ribbon 'S' Monogram (Concept 1) -->
  <g filter="url(#glow)">
    <!-- Back / Inner Fold layer of ribbon -->
    <path d="
      M 345 130
      C 345 80, 290 60, 240 60
      C 180 60, 150 100, 150 145
      C 150 200, 195 235, 255 265
      C 310 295, 345 325, 345 375
      C 345 425, 295 452, 240 452
      C 180 452, 145 415, 145 370
      L 190 370
      C 190 395, 212 414, 242 414
      C 275 414, 302 396, 302 372
      C 302 338, 270 315, 215 285
      C 160 255, 110 215, 110 145
      C 110 75, 170 22, 245 22
      C 320 22, 385 68, 385 130
      Z
    " fill="url(#ribbonOuter)"/>

    <!-- Front 3D Ribbon Twist Highlights -->
    <path d="
      M 345 130
      C 345 80, 290 60, 240 60
      C 180 60, 150 100, 150 145
      C 150 185, 180 215, 225 242
      C 200 225, 185 200, 185 160
      C 185 110, 220 85, 258 85
      C 298 85, 330 105, 335 138
      Z
    " fill="#ffffff" opacity="0.25"/>

    <path d="
      M 190 370
      C 190 395, 212 414, 242 414
      C 275 414, 302 396, 302 372
      C 302 345, 280 325, 240 305
      C 260 318, 275 338, 275 362
      C 275 385, 258 395, 238 395
      C 215 395, 202 382, 200 370
      Z
    " fill="#34d399" opacity="0.4"/>
  </g>
</svg>